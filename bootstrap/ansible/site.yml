# ============================================================
# Ansible — ZhiYu-Backend 服务器初始化
# 支持: Ubuntu 22.04+ / Debian 12+ / CentOS 7
#
# 用法:
#   ansible all -i inventory/dev -m ping                     # 检查连接
#   ansible-playbook -i inventory/dev site.yml               # 离线（默认）
#   ansible-playbook -i inventory/dev site.yml -e offline=false  # 在线
# ============================================================

- name: ZhiYu-Backend 服务器初始化
  hosts: all
  become: yes
  vars:
    offline: true
    packages_dir: "{{ playbook_dir }}/../packages"
    jdk_version: "21"
    docker_users: ["{{ ansible_user | default('ubuntu') }}"]

  pre_tasks:
    - name: 基础信息
      debug:
        msg:
          - "目标主机: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "离线模式: {{ offline }}"
          - "安装包路径: {{ packages_dir }}"

    - name: 检查离线包目录
      stat:
        path: "{{ packages_dir }}"
      register: packages_stat
      when: offline | bool

    - name: 离线包缺失 — 终止
      fail:
        msg: >
          离线包目录不存在: {{ packages_dir }}
          请先在联网机器运行: ./bootstrap/download-packages.sh
          然后将 bootstrap/ 目录复制到控制节点
      when:
        - offline | bool
        - not packages_stat.stat.exists

  roles:
    - role: common
    - role: docker
    - role: kubectl
    - role: jdk

  post_tasks:
    - name: 安装验证
      shell: |
        echo "=== 安装验证 ==="
        docker --version 2>&1 || echo "docker: MISSING"
        kubectl version --client --short 2>&1 || kubectl version --client 2>&1 || echo "kubectl: MISSING"
        java -version 2>&1 | head -1 || echo "java: MISSING"
        openssl version 2>&1 || echo "openssl: MISSING"
      register: verify_result
      changed_when: false

    - name: 验证结果
      debug:
        msg: "{{ verify_result.stdout_lines }}"

    - name: 下一步提示
      debug:
        msg:
          - "服务器初始化完成 ✓"
          - "下一步: cd {{ playbook_dir }}/../.. && ./deploy/deploy.sh {{ env | default('dev') }} infra"
