---
# Docker Engine 安装
# 在线: apt (Debian) / yum (RedHat)
# 离线: Docker Static 二进制（所有 Linux 通用）

- name: 检查 Docker 是否已安装
  command: docker --version
  register: docker_installed
  changed_when: false
  failed_when: false

# ═══════════════════════════════════════════════════════════════
# Debian 系列 — 在线模式
# ═══════════════════════════════════════════════════════════════
- name: 安装 Docker（Debian 在线 — 官方仓库）
  when:
    - docker_installed.rc != 0
    - not offline | bool
    - ansible_os_family == "Debian"
  block:
    - name: 添加 Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /usr/share/keyrings/docker-archive-keyring.gpg

    - name: 确定 Docker APT 架构标识
      set_fact:
        deb_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

    - name: 添加 Docker APT 仓库
      apt_repository:
        repo: "deb [arch={{ deb_arch }} signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: 安装 Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

# ═══════════════════════════════════════════════════════════════
# RedHat 系列 — 在线模式
# ═══════════════════════════════════════════════════════════════
- name: 安装 Docker（RedHat 在线 — 官方仓库）
  when:
    - docker_installed.rc != 0
    - not offline | bool
    - ansible_os_family == "RedHat"
  block:
    - name: 安装 yum-utils
      yum:
        name: yum-utils
        state: present

    - name: 添加 Docker CE yum 仓库
      yum_repository:
        name: docker-ce
        description: Docker CE Stable
        baseurl: https://download.docker.com/linux/centos/7/$basearch/stable
        gpgkey: https://download.docker.com/linux/centos/gpg
        gpgcheck: yes
        enabled: yes

    - name: 安装 Docker
      yum:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

# ═══════════════════════════════════════════════════════════════
# 离线模式 — Docker Static 二进制（所有 Linux 通用）
# ═══════════════════════════════════════════════════════════════
- name: 安装 Docker（离线 — Static 二进制）
  when:
    - docker_installed.rc != 0
    - offline | bool
  block:
    - name: 查找 Docker static 包
      find:
        paths: "{{ packages_dir }}/docker"
        patterns: "docker-*.tgz"
      register: docker_tar

    - name: 无离线 Docker 包 — 错误
      fail:
        msg: >
          离线 Docker 包未找到 ({{ packages_dir }}/docker/docker-*.tgz)。
          请运行: ./bootstrap/download-packages.sh
      when: docker_tar.files | length == 0

    - name: 创建临时解压目录
      tempfile:
        state: directory
      register: docker_tmp
      when: docker_tar.files | length > 0

    - name: 解压 Docker static 包
      unarchive:
        src: "{{ docker_tar.files[0].path }}"
        dest: "{{ docker_tmp.path }}"
        remote_src: yes
      when: docker_tar.files | length > 0

    - name: 安装 Docker 二进制文件到 /usr/local/bin
      copy:
        src: "{{ docker_tmp.path }}/docker/"
        dest: /usr/local/bin/
        mode: "0755"
        remote_src: yes
      when: docker_tar.files | length > 0

    - name: 清理临时目录
      file:
        path: "{{ docker_tmp.path }}"
        state: absent
      when: docker_tar.files | length > 0

    - name: 创建 containerd systemd 服务
      copy:
        dest: /etc/systemd/system/containerd.service
        content: |
          [Unit]
          Description=containerd container runtime
          Documentation=https://containerd.io
          After=network.target local-fs.target

          [Service]
          ExecStartPre=-/sbin/modprobe overlay
          ExecStart=/usr/local/bin/containerd
          Type=notify
          Delegate=yes
          KillMode=process
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: 创建 docker systemd 服务
      copy:
        dest: /etc/systemd/system/docker.service
        content: |
          [Unit]
          Description=Docker Application Container Engine
          Documentation=https://docs.docker.com
          After=network-online.target firewalld.service containerd.service
          Wants=network-online.target
          Requires=containerd.service

          [Service]
          Type=notify
          ExecStart=/usr/local/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock
          ExecReload=/bin/kill -s HUP $MAINPID
          TimeoutStartSec=0
          RestartSec=2
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: 创建 docker socket 服务
      copy:
        dest: /etc/systemd/system/docker.socket
        content: |
          [Unit]
          Description=Docker Socket for the API

          [Socket]
          ListenStream=/var/run/docker.sock
          SocketMode=0660
          SocketUser=root
          SocketGroup=docker

          [Install]
          WantedBy=sockets.target

    - name: 创建 docker 用户组
      group:
        name: docker
        state: present

    - name: 重载 systemd
      systemd:
        daemon_reload: yes

    - name: 启动 containerd
      systemd:
        name: containerd
        state: started
        enabled: yes

# ═══════════════════════════════════════════════════════════════
# 启动服务 + 用户组（所有安装模式通用）
# ═══════════════════════════════════════════════════════════════
- name: 启动 Docker 服务
  systemd:
    name: docker
    state: started
    enabled: yes

- name: 将用户加入 docker 组
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  when: docker_installed.rc != 0
