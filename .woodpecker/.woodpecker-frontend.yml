# ============================================================
# ZhiYu Admin Web — 前端 CI/CD 流水线
# 触发条件: frontend/ 目录有变更时
# 与 .woodpecker.yml (后端) 独立并行运行
#
# 注意: 当 frontend/package.json 不存在时（前端尚未实现），
# 所有步骤自动跳过。前端代码就绪后流水线自动激活。
# ============================================================

when:
  event: [push, pull_request]
  path:
    include: ["frontend/**"]

steps:
  # ---- Stage 1: 依赖安装 + 静态检查 ----
  install:
    image: node:20-alpine
    commands:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "⏭ frontend/package.json 不存在，跳过（前端尚未实现）"
          exit 0
        fi
      - cd frontend
      - npm ci --prefer-offline
      - npm run lint
      - npm run typecheck

  # ---- Stage 2: 编码规范合规检查 ----
  compliance-checks:
    image: node:20-alpine
    commands:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "⏭ 跳过合规检查（前端尚未实现）"
          exit 0
        fi
      - cd frontend
      - bash scripts/check-unwrap.sh
      - bash scripts/check-i18n.sh
      - bash scripts/check-shared-patterns.sh
    depends_on: [install]

  # ---- Stage 3: 单元测试 + 覆盖率 ----
  unit-test:
    image: node:20-alpine
    commands:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "⏭ 跳过单元测试（前端尚未实现）"
          exit 0
        fi
      - cd frontend
      - npm run test -- --coverage
    depends_on: [install]

  # ---- Stage 4: 无障碍审计 ----
  a11y-check:
    image: node:20-alpine
    commands:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "⏭ 跳过无障碍审计（前端尚未实现）"
          exit 0
        fi
      - cd frontend
      - npx @axe-core/cli --exit --stdout src/
    depends_on: [install]

  # ---- Stage 5: 生产构建 (main 分支仅) ----
  build:
    image: node:20-alpine
    when:
      branch: main
    commands:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "⏭ 跳过构建（前端尚未实现）"
          exit 0
        fi
      - cd frontend
      - npm run build
      - tar czf frontend-dist.tar.gz dist/
    depends_on: [unit-test, a11y-check]

  # ---- Stage 6: E2E 测试 (main 分支仅) ----
  e2e:
    image: mcr.microsoft.com/playwright:v1.44.0-focal
    when:
      branch: main
    commands:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "⏭ 跳过 E2E 测试（前端尚未实现）"
          exit 0
        fi
      - cd frontend
      - npx playwright install --with-deps chromium
      - npx playwright test
    depends_on: [build]

  # ---- Stage 7: 部署到 kubeadm (main 分支仅) ----
  deploy:
    image: alpine:3.21
    when:
      branch: main
    secrets: [ssh_user, ssh_password]
    commands:
      - |
        if [ ! -f frontend/package.json ]; then
          echo "⏭ 跳过部署（前端尚未实现）"
          exit 0
        fi
      - apk add --no-cache openssh-client sshpass rsync
      - |
        sshpass -p "$$SSH_PASSWORD" rsync -avz \
          -e "ssh -o StrictHostKeyChecking=no" \
          frontend/dist/ frontend/Dockerfile frontend/nginx.conf \
          $$SSH_USER@10.211.55.4:/home/parallels/Documents/dev/code/ZhiYu/frontend/
      - |
        sshpass -p "$$SSH_PASSWORD" rsync -avz \
          -e "ssh -o StrictHostKeyChecking=no" \
          deploy/scripts/build-frontend.sh deploy/scripts/deploy-frontend.sh deploy/scripts/common.sh \
          deploy/envs/ deploy/manifests/02-app/deployment-frontend.yaml deploy/manifests/02-app/service-frontend.yaml \
          $$SSH_USER@10.211.55.4:/home/parallels/Documents/dev/code/ZhiYu/deploy/
      - |
        sshpass -p "$$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $$SSH_USER@10.211.55.4 "
          cd /home/parallels/Documents/dev/code/ZhiYu &&
          export PROJECT_VERSION=\$(cat .version) &&
          ./deploy/scripts/build-frontend.sh kubeadm"
      - |
        sshpass -p "$$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $$SSH_USER@10.211.55.4 "
          cd /home/parallels/Documents/dev/code/ZhiYu &&
          ./deploy/scripts/deploy-frontend.sh kubeadm"
    depends_on: [e2e]
