# ============================================================
# ZhiYu-Backend Woodpecker CI/CD 流水线 (v3.4.0)
#
# 触发规则:
#   feature/* / PR → main  → build + test
#   main push              → build + test + package + deploy
#   cron (schedule)        → 安全扫描
# ============================================================

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      lfs: false

steps:
  # ── Stage 1: 静态检查 ──
  checkstyle:
    image: maven:3.9-eclipse-temurin-21
    commands:
      - mvn -f backend/pom.xml -s backend/.mvn/settings.xml checkstyle:check -B -pl zhiyu-server

  spotbugs:
    image: maven:3.9-eclipse-temurin-21
    commands:
      - mvn -f backend/pom.xml -s backend/.mvn/settings.xml test-compile spotbugs:check -B -pl zhiyu-server -am

  # ── Stage 2: 单元测试 + 覆盖率 ──
  unit-test:
    image: maven:3.9-eclipse-temurin-21
    commands:
      - mvn -f backend/pom.xml -s backend/.mvn/settings.xml test -B -pl zhiyu-server -am
    environment:
      MAVEN_OPTS: "-Xmx1g -XX:+UseG1GC"

  coverage:
    image: maven:3.9-eclipse-temurin-21
    commands:
      - |
        COV=0
        for f in $$(find . -path "*/target/site/jacoco/index.html" 2>/dev/null); do
          LINE_COV=$$(grep -oP 'Total.*?ctr2">\K[0-9]+' "$$f" | head -1 || echo 0)
          echo "Coverage: $$f → $${LINE_COV}%"
          [ "$$LINE_COV" -gt "$$COV" ] && COV=$$LINE_COV
        done
        echo "Overall coverage: $${COV}%"
        if [ "$$COV" -lt 80 ]; then
          echo "❌ Coverage $${COV}% < 80% threshold"
          exit 1
        fi
        echo "✓ Coverage >= 80%"

  # ── Stage 3: 集成测试 (仅 main/release) ──
  integration-test:
    image: maven:3.9-eclipse-temurin-21
    when:
      branch: [main]
      event: push
    commands:
      - mvn -f backend/pom.xml -s backend/.mvn/settings.xml verify -B -pl zhiyu-server -am -DskipUTs=true -Dpmd.skip=true -Djacoco.skip=true
    environment:
      MAVEN_OPTS: "-Xmx1g -XX:+UseG1GC"
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_URL: jdbc:tc:mysql:8.0:///zhiyu_test
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TESTCONTAINERS_RYUK_DISABLED: "true"

  # ── Stage 4: Maven 打包 (仅 main/release) ──
  package:
    image: maven:3.9-eclipse-temurin-21
    when:
      branch: [main]
      event: push
    commands:
      - mvn -f backend/pom.xml -s backend/.mvn/settings.xml package -DskipTests -B -q -pl zhiyu-server -am
      - java -Djarmode=tools -jar backend/zhiyu-server/target/zhiyu-server-*.jar extract --layers --launcher --destination backend/zhiyu-server/target/extracted

  # ── Stage 5: Docker 镜像构建 (仅 main/release) ──
  docker-build:
    image: docker:cli
    when:
      branch: [main]
      event: push
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - VERSION=$$(cat .version)
      - docker build -t zhiyu-backend:$$VERSION -f deploy/docker/Dockerfile.kubeadm .
      - docker tag zhiyu-backend:$$VERSION zhiyu-backend:latest
      - echo "Built zhiyu-backend:$$VERSION"

  # ── Stage 6: 镜像安全扫描 (仅 main/release) ──
  trivy-scan:
    image: aquasec/trivy:latest
    when:
      branch: [main]
      event: push
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - trivy image zhiyu-backend:latest --severity HIGH,CRITICAL --exit-code 1

  # ── Stage 7: OWASP 依赖安全检查 ──
  owasp-dependency-check:
    image: maven:3.9-eclipse-temurin-21
    when:
      event: [push, pull_request]
    commands:
      - mvn -f backend/pom.xml -s backend/.mvn/settings.xml install -DskipTests -Dpmd.skip=true -B -q
      - mvn -f backend/pom.xml -s backend/.mvn/settings.xml org.owasp:dependency-check-maven:check -B -pl zhiyu-server -am
    environment:
      MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"

  # ── Stage 8: 密钥泄露扫描 ──
  gitleaks:
    image: zricethezav/gitleaks:latest
    when:
      event: [push, pull_request]
    commands:
      - gitleaks detect --source . --exit-code 1

  # ── Stage 8.5: ZAP 基线安全扫描 (仅 main push + schedule) ──
  zap-baseline-scan:
    image: ghcr.io/zaproxy/zaproxy:stable
    when:
      branch: [main]
      event: [push, cron]
    commands:
      - mkdir -p /tmp/zap-wrk
      - echo "Starting ZAP baseline scan..."
      - zap-baseline.py -t http://10.211.55.4:31340 -r /tmp/zap-wrk/zap-baseline-report.html -l WARN

  # ── Stage 9: 部署到 kubeadm (仅 main push) ──
  deploy:
    image: alpine:3.21
    when:
      branch: main
      event: push
    environment:
      SSH_USER:
        from_secret: ssh_user
      SSH_PASSWORD:
        from_secret: ssh_password
    commands:
      - apk add --no-cache openssh-client sshpass
      - |
        echo "Deploying to kubeadm cluster ($${SSH_USER}@10.211.55.4)..."
        sshpass -p "$${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no \
          "$${SSH_USER}@10.211.55.4" \
          "cd /home/parallels/Documents/dev/code/ZhiYu && ./deploy/deploy.sh kubeadm all"
      - echo "Deploy completed ✓"

  # ── Stage 10: E2E 冒烟测试 (仅 main push) ──
  e2e-smoke:
    image: alpine/curl:latest
    when:
      branch: main
      event: push
    commands:
      - |
        echo "── E2E Smoke Tests ──"
        echo "Test: /actuator/health"
        HEALTH=$$(curl -s -o /dev/null -w "%{http_code}" -H "Host: localhost" http://10.211.55.4:31340/actuator/health)
        if [ "$$HEALTH" = "200" ]; then
          echo "  ✓ /actuator/health → 200"
        else
          echo "  ✗ /actuator/health → $$HEALTH"
          exit 1
        fi
        echo "E2E 冒烟测试通过 ✓"

# ── 触发器范围 ──
when:
  event: [push, pull_request, cron]

services:
  redis:
    image: redis:7-alpine
