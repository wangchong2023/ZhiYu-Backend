# ============================================================
# ZhiYu-Backend — RBAC
# 最小权限 Role + RoleBinding，仅授予 Pod 列表查询权限
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zhiyu-backend-pod-reader
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zhiyu-backend-pod-reader
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zhiyu-backend-pod-reader
subjects:
  - kind: ServiceAccount
    name: zhiyu-backend
    namespace: ${K8S_NAMESPACE}
