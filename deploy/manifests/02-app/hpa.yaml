# ============================================================
# ZhiYu-Backend — HorizontalPodAutoscaler
# 基于 CPU + Memory 自动扩缩容
# 各环境参数通过 envsubst 注入
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zhiyu-backend
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zhiyu-backend
  minReplicas: ${HPA_MIN_REPLICAS}
  maxReplicas: ${HPA_MAX_REPLICAS}
  metrics:
    # CPU 目标 70%：请求密集型 API，在请求量上升时快速响应
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory 目标 80%：Java 应用内存波动大，80% 给出合理缓冲
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    # 缩容保守：稳定窗口 5 分钟，每分钟最多缩 50%（避免频繁抖动）
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    # 扩容激进：稳定窗口 1 分钟，每 30 秒可翻倍（快速应对流量尖峰）
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
