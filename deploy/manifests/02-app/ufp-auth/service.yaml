# ============================================================
# ufp-auth-service — Service (ClusterIP)
# 仅集群内可访问，通过 ufp-gateway 对外暴露
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: ufp-auth
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ufp-auth
spec:
  type: ClusterIP
  selector:
    app: ufp-auth
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  sessionAffinity: None
