# ============================================================
# ufp-auth-service — ConfigMap
# 认证服务非敏感配置
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: ufp-auth-config
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ufp-auth
data:
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE}"
  NACOS_SERVER_ADDR: "${NACOS_HOST}:${NACOS_PORT}"
  NACOS_NAMESPACE: "${NACOS_NAMESPACE}"
  SPRING_CLOUD_NACOS_CONFIG_ENABLED: "${NACOS_CONFIG_ENABLED}"
  SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "${NACOS_DISCOVERY_ENABLED}"
  SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_DATA_REDIS_HOST: "${REDIS_HOST}"
  SPRING_DATA_REDIS_PORT: "${REDIS_PORT}"
  JAVA_OPTS: >-
    -XX:+UseZGC
    -XX:MaxRAMPercentage=75.0
    -XX:+ExitOnOutOfMemoryError
    -Djava.security.egd=file:/dev/./urandom
    -Duser.home=/tmp
    -Dcsp.sentinel.log.dir=/tmp
