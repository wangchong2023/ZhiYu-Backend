# ============================================================
# ZhiYu — RBAC
# 最小权限 Role + RoleBinding
# zhiyu-admin-service 需要 Pod 列表查询权限（监控面板）
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zhiyu-pod-reader
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zhiyu-pod-reader
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zhiyu-pod-reader
subjects:
  - kind: ServiceAccount
    name: zhiyu-backend
    namespace: ${K8S_NAMESPACE}
