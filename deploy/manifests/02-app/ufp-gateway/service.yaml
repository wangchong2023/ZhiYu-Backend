# ============================================================
# ufp-gateway-service — Service (NodePort)
# API 网关对外暴露，同时承载前端 SPA 静态文件
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: ufp-gateway
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ufp-gateway
spec:
  type: NodePort
  selector:
    app: ufp-gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: ${GATEWAY_NODE_PORT}
  sessionAffinity: None
