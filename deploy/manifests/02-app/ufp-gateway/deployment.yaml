# ==============================================================================
# ufp-gateway-service — API 网关 + 前端静态文件服务
#
# 架构角色:
#   1. Spring Cloud Gateway 统一入口（Netty 响应式，替代 Nginx）
#   2. Sentinel 网关层限流
#   3. 前端 SPA 静态文件服务（替代 admin-web Nginx 容器）
#   4. Nacos 服务发现 + 路由转发至后端微服务
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ufp-gateway
  namespace: ${K8S_NAMESPACE}
  labels:
    app: ufp-gateway
spec:
  replicas: ${GATEWAY_REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ufp-gateway
  template:
    metadata:
      labels:
        app: ufp-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ufp-gateway
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-nacos
          image: ${BUSYBOX_IMAGE}
          command:
            - /bin/sh
            - -c
            - |
              until wget -q -O- http://${NACOS_HOST}:${NACOS_PORT}/nacos/v1/console/health/readiness 2>/dev/null | grep -iq "ok"; do
                echo "Waiting for Nacos ${NACOS_HOST}:${NACOS_PORT}..."
                sleep 3
              done
              echo "Nacos is ready"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: ufp-gateway
          image: ${GATEWAY_IMAGE_FULL}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ufp-gateway-config
            - secretRef:
                name: zhiyu-backend-secret
          env:
            - name: JDK_JAVA_OPTIONS
              value: "-XX:InitialRAMPercentage=50.0"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: ${GATEWAY_CPU_REQUEST}
              memory: ${GATEWAY_MEM_REQUEST}
            limits:
              cpu: ${GATEWAY_CPU_LIMIT}
              memory: ${GATEWAY_MEM_LIMIT}
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
