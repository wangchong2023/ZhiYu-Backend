# ============================================================
# zhiyu-admin-service — HPA
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zhiyu-admin
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-admin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zhiyu-admin
  minReplicas: ${ADMIN_SVC_HPA_MIN}
  maxReplicas: ${ADMIN_SVC_HPA_MAX}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
