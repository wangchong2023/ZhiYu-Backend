# ==============================================================================
# 项目名称: ZhiYu-Backend (智宇后端)
# 清单名称: configmap.yaml
# 清单功能: ZhiYu 微服务应用的非敏感配置项 K8s ConfigMap。
#           存储 Spring Boot 外部化配置的非敏感部分（数据源 URL、Nacos 地址、JVM 参数等），
#           与 secret.yaml 中的敏感凭证（密码、密钥）分离存储，遵循最小权限原则。
#
#           工作原理：
#             1. deploy.sh 通过 envsubst 将 ${VAR} 占位符替换为 config.env 中的真实值
#             2. 渲染后的 ConfigMap 通过 kubectl apply 提交到 K8s
#             3. deployment.yaml 中通过 envFrom.configMapRef 将所有 Key 以环境变量形式注入容器
#             4. Spring Boot 的 @Value / @ConfigurationProperties 自动读取这些环境变量，
#                覆盖 application.yml 中的默认值（环境变量优先级高于配置文件）
#
#           更新策略：
#             - 修改 ConfigMap 后需滚动重启 Deployment 才能生效：
#               kubectl rollout restart deployment/zhiyu-backend -n ${K8S_NAMESPACE}
#             - 若使用 Volume 挂载（非 envFrom），ConfigMap 内容更新后约 1-2 分钟自动同步，
#               但环境变量模式（envFrom）必须重启才能生效。
#
# 依赖变量 (由 deploy-app.sh 中的 envsubst 从 config.env 渲染注入):
#   SPRING_PROFILES_ACTIVE     - Spring 激活的 Profile（如 kubeadm, dev, prod）
#   NACOS_HOST / NACOS_PORT    - Nacos 注册配置中心地址（如 nacos:8848）
#   NACOS_NAMESPACE            - Nacos 命名空间 ID（用于配置隔离）
#   NACOS_CONFIG_ENABLED       - 是否启用 Nacos 配置中心（true/false）
#   NACOS_DISCOVERY_ENABLED    - 是否启用 Nacos 服务发现（true/false）
#   MYSQL_HOST/PORT/DATABASE   - MySQL 连接参数
#   REDIS_HOST / REDIS_PORT    - Redis 连接参数
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: zhiyu-backend-config
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
data:
  # ── Spring Boot Profile 激活 ──────────────────────────────────────────────
  # 控制加载哪个 application-<profile>.yml 配置文件，
  # 不同环境（kubeadm/dev/prod）对应不同的 Spring 配置分支。
  SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE}"

  # ── Nacos 注册配置中心连接参数 ────────────────────────────────────────────
  # 格式：<host>:<port>，微服务启动时自动向此地址进行服务注册和配置拉取。
  NACOS_SERVER_ADDR: "${NACOS_HOST}:${NACOS_PORT}"
  # Nacos 命名空间 ID（在 Nacos 控制台创建的隔离空间，空值=使用 public 默认命名空间）
  NACOS_NAMESPACE: "${NACOS_NAMESPACE}"

  # ── Nacos 功能开关（独立控制配置中心和服务发现）─────────────────────────
  # 在 kubeadm 单机环境中可将两者均设为 false，应用直接读取本地 application.yml，
  # 跳过 Nacos 依赖，降低本地调试的复杂度。
  SPRING_CLOUD_NACOS_CONFIG_ENABLED: "${NACOS_CONFIG_ENABLED}"       # 是否启用 Nacos 配置中心
  SPRING_CLOUD_NACOS_DISCOVERY_ENABLED: "${NACOS_DISCOVERY_ENABLED}" # 是否启用 Nacos 服务发现（注册中心）

  # ── Spring Boot 数据源配置（覆盖 application.yml 默认值）──────────────────
  # K8s 环境下通过环境变量动态注入数据库连接串，覆盖代码中的 application.yml 配置，
  # 实现配置与代码的完全解耦，同一镜像可部署到不同环境。
  # JDBC URL 关键参数说明：
  #   useUnicode=true&characterEncoding=UTF-8 : 确保中文字符正确处理，防止乱码
  #   serverTimezone=Asia/Shanghai            : 显式指定时区，与 MySQL 服务器保持一致
  SPRING_DATASOURCE_URL: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"  # MySQL 8.x 推荐驱动类名

  # ── Redis 连接参数 ────────────────────────────────────────────────────────
  # 仅配置 Host/Port，密码通过 secret.yaml 中的 SPRING_DATA_REDIS_PASSWORD 安全注入
  SPRING_DATA_REDIS_HOST: "${REDIS_HOST}"
  SPRING_DATA_REDIS_PORT: "${REDIS_PORT}"

  # ── 安全配置 ───────────────────────────────────────────────────────────────
  # Admin API IP 白名单: 逗号分隔的 IP 地址、CIDR 网段，或 "*" 表示全部放行
  ZHIYU_SECURITY_ADMIN_IP_WHITELIST: "${ZHIYU_SECURITY_ADMIN_IP_WHITELIST}"

  # ── JVM 启动参数（生产级调优） ────────────────────────────────────────────
  # 注意：deployment.yaml 中的 JDK_JAVA_OPTIONS 优先级高于此 JAVA_OPTS，两者共同生效。
  # 参数说明：
  #   -XX:+UseZGC                  : 使用低延迟 Z 垃圾收集器（JDK 17+），GC 暂停时间 < 1ms
  #   -XX:MaxRAMPercentage=75.0    : 动态设置最大堆为容器内存限额的 75%，配合 K8s limits 自适应调优
  #   -XX:+ExitOnOutOfMemoryError  : OOM 时立即退出（而非线程死亡），触发 K8s 自动重启恢复
  #   -Djava.security.egd=...urandom: 加速 SecureRandom 的熵池初始化，防止首次 JWT 签发阻塞
  #   -Duser.home=/tmp             : 将用户 home 指向可写的 /tmp，兼容只读根文件系统（readOnlyRootFilesystem）
  #   -Dcsp.sentinel.log.dir=/tmp  : 同理，Sentinel 限流日志写入 /tmp，绕过只读根文件系统限制
  JAVA_OPTS: >-
    -XX:+UseZGC
    -XX:MaxRAMPercentage=75.0
    -XX:+ExitOnOutOfMemoryError
    -Djava.security.egd=file:/dev/./urandom
    -Duser.home=/tmp
    -Dcsp.sentinel.log.dir=/tmp
