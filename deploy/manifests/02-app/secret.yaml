# ==============================================================================
# 项目名称: ZhiYu-Backend (智宇后端)
# 清单名称: secret.yaml
# 清单功能: ZhiYu 微服务应用凭证 K8s Secret 的参考文档模板（非直接部署文件）。
#
# 重要说明：
#   ⚠️  本文件仅作为凭证字段说明文档，deploy.sh 在实际部署时并不 apply 此 YAML，
#       而是通过 kubectl create secret generic 命令动态构建 Secret，
#       将实时渲染的敏感字段（密码、JWT 密钥、第三方密钥）安全注入 K8s。
#
# 凭证注入流程：
#   1. ensure-secrets.sh 在本地 envs/<env>/passwords.env 中生成/恢复持久化密码
#   2. deploy-app.sh 读取密码并将 JWT PEM 文件 Base64 编码后，执行：
#      kubectl create secret generic zhiyu-backend-secret \
#        --from-literal=SPRING_DATASOURCE_USERNAME=<用户名> \
#        --from-literal=SPRING_DATASOURCE_PASSWORD=<密码> \
#        --from-literal=JWT_PRIVATE_KEY=<Base64编码私钥> \
#        ...（以下所有字段均以此方式注入）
#
# 生产安全加固建议：
#   - 推荐使用 Sealed Secrets：通过 kubeseal 将 Secret 加密后存储在 Git 仓库，
#     实现 GitOps 下的 Secret 版本管理，不泄露明文。
#   - 推荐使用 External Secrets Operator：对接阿里云 KMS、Vault、AWS Secrets Manager
#     等外部密钥管理系统，实现密钥的统一管控和自动轮换。
# ==============================================================================

# ── 手动创建参考命令 ──────────────────────────────────────────────────────────
# 在首次部署或手动恢复 Secret 时，可参考以下命令构建完整 Secret：
#
# kubectl -n ${K8S_NAMESPACE} create secret generic zhiyu-backend-secret \
#   --from-literal=SPRING_DATASOURCE_USERNAME='zhiyu' \       # 数据库应用用户名
#   --from-literal=SPRING_DATASOURCE_PASSWORD='<密码>' \       # 数据库应用密码
#   --from-literal=SPRING_DATA_REDIS_PASSWORD='<密码>' \       # Redis 连接密码
#   --from-literal=JWT_PRIVATE_KEY='$(base64 < jwt-private.pem | tr -d '\n')' \  # RS256 私钥（签发 Token）
#   --from-literal=JWT_PUBLIC_KEY='$(base64 < jwt-public.pem | tr -d '\n')' \    # RS256 公钥（验证 Token）
#   --from-literal=ENCRYPTION_KEY='$(openssl rand -base64 32)' \  # AES 对称加密密钥（用于手机号等敏感字段加密存储）
#   --from-literal=WECHAT_APP_ID='<微信小程序 AppID>' \           # 微信登录 AppID
#   --from-literal=WECHAT_APP_SECRET='<微信小程序 AppSecret>' \   # 微信登录 AppSecret（请勿泄露！）
#   --from-literal=ALIPAY_APP_ID='<支付宝应用 AppID>' \           # 支付宝支付 AppID
#   --from-literal=ALIPAY_PRIVATE_KEY='<支付宝应用私钥>' \        # 支付宝应用私钥（RSA2）
#   --from-literal=ALIPAY_ALIPAY_PUBLIC_KEY='<支付宝公钥>' \      # 支付宝官方公钥（用于验签）
#   --from-literal=WECHAT_PAY_MCH_ID='<微信支付商户号>' \         # 微信商户号（MCH_ID）
#   --from-literal=WECHAT_PAY_API_V3_KEY='<微信支付 APIv3 密钥>' \ # 微信支付 v3 回调验签密钥
#   --from-literal=ALIYUN_ACCESS_KEY_ID='<阿里云 AccessKey ID>' \ # 阿里云服务（OSS/短信等）AccessKey
#   --from-literal=ALIYUN_ACCESS_KEY_SECRET='<阿里云 AccessKey Secret>'  # 阿里云 AccessKey Secret

apiVersion: v1
kind: Secret
metadata:
  name: zhiyu-backend-secret
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
type: Opaque
# stringData 字段在实际部署时为空，所有值由 deploy-app.sh 通过 kubectl create 动态注入。
# 本文件不作为实际部署 YAML 使用，仅供了解 Secret 字段结构和进行手动恢复操作时参考。
stringData: {}  # 实际凭证值由 deploy.sh 中的 kubectl create secret 命令动态注入
