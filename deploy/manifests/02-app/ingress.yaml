# ==============================================================================
# 项目名称: ZhiYu-Backend (智宇后端)
# 清单名称: ingress.yaml
# 清单功能: ZhiYu 微服务的 Kubernetes Ingress（南北向流量入口）声明式定义。
#           负责将外部 HTTP(S) 请求通过 nginx-ingress-controller 路由至后端 Service，
#           并配置路径匹配规则、上传限制、请求超时、访问限流以及 TLS/SSL 配置预留。
#
#           架构特性：
#             1. 路径路由策略（双规则）：
#                - /api/v1 (Prefix)：匹配所有以 /api/v1 开头的 RESTful 业务 API 路径，
#                  作为微服务主入口，覆盖用户、订单、支付等全部业务接口。
#                - /actuator/health (Exact)：精确匹配健康检查路径，对外暴露 liveness/readiness
#                  状态，用于负载均衡器（如阿里云 SLB、AWS ALB）定期探活检测。
#             2. nginx-ingress 注解配置：
#                - proxy-body-size: 限制单次上传请求体最大 20MB（头像、证书等附件场景）
#                - proxy-read-timeout: 后端响应超时 60s（长轮询/SSE 场景可适当延长）
#                - limit-rps: 基于单客户端 IP 的访问限流（100 req/s），防止 CC 攻击
#                - ssl-redirect: 由环境变量控制是否强制 HTTP → HTTPS 跳转
#             3. TLS 配置预留：
#                - tls 字段已配置（hosts + secretName），在 K8s Secret 中存入 TLS 证书后立即生效；
#                - kubeadm 本地环境下 INGRESS_TLS_SECRET 为空值时，nginx-ingress 会跳过 HTTPS；
#                - 生产环境建议配置 cert-manager 自动颁发和续签 Let's Encrypt 证书。
#
# 依赖变量 (由 envsubst 从 config.env 渲染注入):
#   K8S_NAMESPACE        - K8s 命名空间
#   INGRESS_HOST         - 对外域名（如 api.zhiyu.com 或宿主机 IP）
#   INGRESS_CLASS        - Ingress Controller 类型（如 nginx）
#   INGRESS_TLS_SECRET   - TLS 证书对应的 K8s Secret 名称（留空则不启用 HTTPS）
#   INGRESS_SSL_REDIRECT - 是否强制 HTTP 跳转 HTTPS（true/false）
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zhiyu-backend
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
  annotations:
    # ── nginx-ingress-controller 行为配置注解 ──────────────────────────────
    # 上传请求体大小限制：允许最大 20MB 的请求体，支持头像图片/证书文件等附件上传
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    # 后端响应读取超时（秒）：60s 适合普通 REST API；长轮询/SSE/WebSocket 场景请调大此值
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # 请求发送超时（秒）：客户端向 nginx 上传请求体的超时时间
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # 单 IP 访问限流：每秒最多 100 次请求，超出后 nginx 返回 503，防止暴力攻击和爬虫刷接口
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # SSL 跳转控制：true=强制 HTTP→HTTPS 跳转；false=允许 HTTP 访问（dev/本地调试时使用）
    nginx.ingress.kubernetes.io/ssl-redirect: "${INGRESS_SSL_REDIRECT}"
spec:
  # Ingress Controller 类名，对应集群中已安装的 nginx ingress controller
  ingressClassName: ${INGRESS_CLASS}

  # ── TLS 配置（证书预留，可选） ────────────────────────────────────────────
  # 当 INGRESS_TLS_SECRET 有值且对应 K8s Secret 包含有效 TLS 证书时，nginx-ingress 自动
  # 完成 HTTPS 加密终止（TLS Termination），转发给后端 Service 的仍为 HTTP 明文流量。
  # 本地 kubeadm 环境中可留空（nginx-ingress 会忽略空 secretName），无需修改其他配置。
  tls:
    - hosts:
        - ${INGRESS_HOST}           # 需与证书 CN/SAN 字段匹配
      secretName: ${INGRESS_TLS_SECRET}  # 存储 tls.crt + tls.key 的 K8s Secret

  rules:
    - host: ${INGRESS_HOST}         # 域名匹配（Host Header 路由）
      http:
        paths:
          # ── 业务 API 主路由（Prefix 前缀匹配） ────────────────────────────
          # Prefix 类型：匹配所有以 /api/v1 开头的子路径，包括 /api/v1/user, /api/v1/order 等
          # 覆盖全部业务 RESTful 接口，是微服务对外提供服务的核心入口。
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: zhiyu-backend
                port:
                  name: http        # 转发至 Service 的 http 命名端口（8080）

          # ── 健康检查路由（Exact 精确匹配） ───────────────────────────────
          # Exact 类型：仅精确匹配 /actuator/health，不匹配子路径（如 /actuator/health/liveness）。
          # 该端点对外暴露 Spring Boot Actuator 的聚合健康状态，供负载均衡器、
          # 监控系统或运维团队快速判断服务是否可用，无需鉴权即可访问（公开端点）。
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: zhiyu-backend
                port:
                  name: http

          # ── 前端 SPA 路由（Prefix 前缀匹配） ────────────────────────────
          # 所有非 /api/v1、非 /actuator 的请求转发到 admin-web 前端容器。
          # 配置优先级：/api/v1 > /actuator/health > /（前端兜底）。
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-web
                port:
                  name: http
