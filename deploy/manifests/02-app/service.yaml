# ============================================================
# ZhiYu-Backend — Service
# ClusterIP 内部暴露，外部通过 Ingress/API Gateway 接入
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: zhiyu-backend
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
spec:
  # ClusterIP：仅集群内可访问，外部流量通过 Ingress/API Gateway 接入（纵深防御）
  type: ClusterIP
  selector:
    app: zhiyu-backend
  ports:
    # 命名端口：Ingress 通过名称引用，避免硬编码端口号
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  # 无会话亲和性：JWT 无状态认证，任意 Pod 可处理请求
  sessionAffinity: None
