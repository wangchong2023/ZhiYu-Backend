# ==============================================================================
# 项目名称: ZhiYu-Backend (智宇后端)
# 清单名称: redis.yaml
# 清单功能: Redis 7 在 Kubernetes 中的有状态缓存服务部署清单。
#           采用 StatefulSet 模式确保 Pod 名称稳定（redis-0），并通过 PVC 持久化 RDB/AOF 数据。
#
#           架构特性：
#             1. RDB + AOF 双重持久化策略：
#                - RDB（Redis DataBase）: 定期将内存快照以二进制压缩格式写入磁盘，恢复速度快，
#                  适合作为全量备份。
#                - AOF（Append Only File）: 记录每次写命令，数据完整性更高，丢失数据量更小（最多丢失 1 秒数据）。
#                - 两种机制互补：节点重启后 Redis 优先加载 AOF 文件进行恢复，保障最小数据损失。
#             2. 密码认证安全机制：运行时从 K8s Secret 注入密码，避免明文出现在 YAML 或命令行中。
#             3. maxmemory-policy 内存淘汰策略：限定 256MB 上限，超出后按 allkeys-lru 算法
#                驱逐最近最少使用的 Key，防止 OOM 导致 Pod 被 K8s 强杀。
#             4. Sidecar 指标采集：redis_exporter 以 Sidecar 模式共享 Pod 网络命名空间，
#                通过 9121 端口暴露 Prometheus 格式指标，无需额外网络策略配置。
#             5. 节点重启自动恢复机制：业务数据持久化于 PVC，节点重启后 K8s 自动重调度并挂载
#                原 PVC（data-redis-0），Redis 优先从 AOF 文件恢复内存状态，业务自动续服。
#
# 依赖变量 (由 envsubst 从 config.env + passwords.env 渲染注入):
#   K8S_NAMESPACE      - K8s 命名空间
#   REDIS_PASSWORD     - Redis 连接认证密码（由 ensure-secrets.sh 自动生成）
#   REDIS_IMAGE        - Redis 容器镜像版本（如 redis:7-alpine）
#   REDIS_EXPORTER_IMAGE - redis_exporter Sidecar 监控镜像版本
#   REDIS_STORAGE      - PVC 持久化存储容量（如 5Gi）
# ==============================================================================

# ── [资源 1/4] Headless Service：为 StatefulSet 提供稳定 Pod DNS 标识 ──────────
# clusterIP: None 使 DNS 直接解析到 Pod IP（redis-0.redis-headless.<ns>.svc.cluster.local），
# 为将来扩展 Redis Sentinel/Cluster 模式奠定基础（各节点间需要通过 DNS 互相发现）。
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: ${K8S_NAMESPACE}
  labels:
    app: redis
spec:
  type: ClusterIP
  clusterIP: None   # Headless 设定：不分配虚拟 IP，DNS 直接指向 Pod IP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
---
# ── [资源 2/4] Secret：Redis 访问密码安全存储 ──────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: ${K8S_NAMESPACE}
  labels:
    app: redis
type: Opaque
stringData:
  password: "${REDIS_PASSWORD}"   # Redis 连接认证密码（高熵随机生成，由 ensure-secrets.sh 管理）
---
# ── [资源 3/4] StatefulSet：Redis 7 有状态控制器 ─────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ${K8S_NAMESPACE}
  labels:
    app: redis
spec:
  serviceName: redis-headless   # 关联 Headless Service，赋予 Pod 稳定的 DNS 域名
  replicas: 1                   # 单节点模式，生产环境如需高可用请配置 Redis Sentinel（replicas: 3）
  podManagementPolicy: OrderedReady  # 有序滚动，确保单节点 Redis 安全重启
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        # ── Prometheus 自动服务发现注解 ──────────────────────────────────
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"      # redis_exporter Sidecar 暴露的 Prometheus 指标端口
        prometheus.io/path: "/metrics"  # redis_exporter 标准指标路径
    spec:
      terminationGracePeriodSeconds: 30  # 优雅终止：给 Redis 30秒完成 RDB 持久化/AOF 刷盘后再关闭
      securityContext:
        fsGroup: 999   # 挂载 PVC 时将 /data 目录权限授予 GID=999（redis 用户组），
                       # 确保非 root 进程（UID=999）可正常读写持久化数据目录
      containers:
        # ── 主容器：Redis 7 缓存进程 ────────────────────────────────────
        - name: redis
          image: ${REDIS_IMAGE}
          command:
            - /bin/sh
            - -c
            - |
              # ── 启动参数说明 ──────────────────────────────────────────
              # --appendonly yes        : 启用 AOF 持久化，与默认的 RDB 共同形成双重持久化策略
              # --requirepass           : 启用密码认证（密码为空时跳过，仅适用于内网 dev 环境）
              # --maxmemory 256mb       : 限制 Redis 最大内存使用量，防止 OOM 触发 K8s OOM-Killer
              # --maxmemory-policy      : allkeys-lru 淘汰策略：优先驱逐最近最少访问的 Key，
              #                          适用于缓存场景（所有 Key 都是可丢弃的缓存数据）
              if [ -n "${REDIS_PASSWORD}" ]; then
                exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --maxmemory 256mb --maxmemory-policy allkeys-lru
              else
                exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
              fi
          env:
            # 从 K8s Secret 安全注入密码，避免明文出现在命令行参数或日志中
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m       # Redis 单线程模型，轻负载下 CPU 消耗 < 0.1 core
              memory: 128Mi   # 含 AOF 重写缓冲区（bgrewriteaof 时会临时翻倍内存使用）
            limits:
              cpu: 500m       # 允许在 RDB 保存（bgsave）/AOF 重写时临时突发到 0.5 core
              memory: 512Mi   # = maxmemory(256MB) + fork COW 开销（最坏情况 ~256MB）+ 内核缓冲区
          # ── 存活探针（Liveness Probe）────────────────────────────────────
          # redis-cli PING 返回 PONG 表示 Redis 进程正常响应，
          # 若 3 次连续失败，K8s 将强制重启 Redis 容器。
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  if [ -n "${REDIS_PASSWORD}" ]; then
                    redis-cli -a "${REDIS_PASSWORD}" ping
                  else
                    redis-cli ping
                  fi
            initialDelaySeconds: 15  # Redis 启动约 3-5 秒，留 15s 充裕余量
            periodSeconds: 10
            timeoutSeconds: 5
          # ── 就绪探针（Readiness Probe）───────────────────────────────────
          # 与存活探针相同的检测命令，但 initialDelaySeconds 更短，
          # 使 Redis 尽快被 Service 纳入端点列表，减少微服务启动时的等待时间。
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  if [ -n "${REDIS_PASSWORD}" ]; then
                    redis-cli -a "${REDIS_PASSWORD}" ping
                  else
                    redis-cli ping
                  fi
            initialDelaySeconds: 5   # Redis 启动极快（< 2s），5s 足以确认就绪
            periodSeconds: 5         # 每 5 秒检测一次（快速响应就绪状态变化）
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data   # RDB（dump.rdb）+ AOF（appendonly.aof）持久化文件目录
          securityContext:
            runAsNonRoot: true
            runAsUser: 999              # redis 官方 alpine 镜像内置 UID=999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL                   # 最小化 Linux Capability，防止容器逃逸

        # ── Sidecar 容器：redis_exporter 监控指标采集器 ──────────────────
        # 与主容器共享 Pod 网络命名空间，通过 127.0.0.1:6379 连接 Redis 实例，
        # 采集 INFO 命令输出的所有运行时指标并转换为 Prometheus 格式，暴露在 9121 端口。
        - name: exporter
          image: ${REDIS_EXPORTER_IMAGE}
          env:
            # 从 K8s Secret 注入 Redis 密码，供 redis_exporter 建立认证连接
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
          ports:
            - name: metrics
              containerPort: 9121   # Prometheus 标准指标端口
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534            # nobody 用户（最小权限原则）
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

  # ── PVC 动态申请模板 ─────────────────────────────────────────────────────
  # 为每个 Pod 副本（redis-0）自动创建独立的 PVC（data-redis-0），
  # Pod 重建时原 PVC 被重新挂载，AOF/RDB 文件完整保留，Redis 自动恢复全部数据。
  # 这是"节点重启业务数据自动恢复"的核心机制，无需运维手动干预。
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: redis
      spec:
        accessModes:
          - ReadWriteOnce   # 单节点读写，标准 Redis 单实例场景
        resources:
          requests:
            storage: ${REDIS_STORAGE}   # 存储容量由 config.env 中 REDIS_STORAGE 变量指定
---
# ── [资源 4/4] ClusterIP Service：集群内固定访问入口 ────────────────────────
# 微服务通过 redis:6379 进行连接，即使 Pod IP 变化也无需修改任何配置。
# 同时暴露 9121 端口，使 Prometheus 可通过 Service 统一访问 redis_exporter 指标。
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ${K8S_NAMESPACE}
  labels:
    app: redis
spec:
  type: NodePort
  ports:
    - name: redis
      port: 6379
      targetPort: 6379    # 转发至主容器 Redis 进程端口
      nodePort: 30679
    - name: metrics
      port: 9121
      targetPort: 9121    # 转发至 Sidecar redis_exporter 指标端口
  selector:
    app: redis
