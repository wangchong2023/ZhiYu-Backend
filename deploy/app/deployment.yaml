# ============================================================
# ZhiYu-Backend — Deployment
# 滚动更新，initContainers 等待依赖就绪
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhiyu-backend
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
spec:
  replicas: ${APP_REPLICAS}
  strategy:
    # maxUnavailable=0 + maxSurge=1: 滚动更新时先建新 Pod，就绪后再删旧 Pod，零中断
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zhiyu-backend
  template:
    metadata:
      labels:
        app: zhiyu-backend
      annotations:
        # Prometheus 自动发现：/actuator/prometheus 暴露 JVM + 业务指标
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: zhiyu-backend
      # 优雅停止：45s 足够 Spring Boot 完成正在处理的请求 + 关闭连接池
      terminationGracePeriodSeconds: 45
      # Pod 级安全上下文：非 root 运行，启用 seccomp 默认策略
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000            # zhiyu 用户 UID（Dockerfile 中创建）
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault     # 阻止危险系统调用（如 ptrace, mount）
      affinity:
        # 反亲和：尽量将 Pod 分散到不同节点，提高可用性（软约束，不阻止调度）
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: zhiyu-backend
                topologyKey: kubernetes.io/hostname
      initContainers:
        # 等待 MySQL 就绪后再启动应用容器（避免 crash loop）
        - name: wait-for-mysql
          image: ${BUSYBOX_IMAGE}
          command:
            - /bin/sh
            - -c
            - |
              until nc -z ${MYSQL_HOST} ${MYSQL_PORT}; do
                echo "Waiting for MySQL ${MYSQL_HOST}:${MYSQL_PORT}..."
                sleep 3
              done
              echo "MySQL is ready"
          env:
            - name: MYSQL_HOST
              value: "${MYSQL_HOST}"
            - name: MYSQL_PORT
              value: "${MYSQL_PORT}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534            # nobody UID
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        # 等待 Nacos 就绪（如未启用则跳过）
        - name: wait-for-nacos
          image: ${BUSYBOX_IMAGE}
          command:
            - /bin/sh
            - -c
            - |
              if [ "${NACOS_CONFIG_ENABLED}" != "true" ] && [ "${NACOS_DISCOVERY_ENABLED}" != "true" ]; then
                echo "Nacos disabled — skipping wait"
                exit 0
              fi
              until wget -q -O- http://${NACOS_HOST}:${NACOS_PORT}/nacos/v1/console/health/readiness 2>/dev/null | grep -q "ok"; do
                echo "Waiting for Nacos ${NACOS_HOST}:${NACOS_PORT}..."
                sleep 3
              done
              echo "Nacos is ready"
          env:
            - name: NACOS_HOST
              value: "${NACOS_HOST}"
            - name: NACOS_PORT
              value: "${NACOS_PORT}"
            - name: NACOS_CONFIG_ENABLED
              value: "${NACOS_CONFIG_ENABLED}"
            - name: NACOS_DISCOVERY_ENABLED
              value: "${NACOS_DISCOVERY_ENABLED}"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: zhiyu-backend
          image: ${IMAGE_FULL}
          imagePullPolicy: ${IMAGE_PULL_POLICY}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: zhiyu-backend-config
            - secretRef:
                name: zhiyu-backend-secret
          env:
            # Sentinel 日志目录指向可写的 /tmp（容器文件系统为 readOnlyRootFilesystem）
            - name: JDK_JAVA_OPTIONS
              value: "-Dcsp.sentinel.log.dir=/tmp"
            # 注入 Pod 元信息，供日志和日志聚合使用
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: ${APP_CPU_REQUEST}
              memory: ${APP_MEM_REQUEST}
            limits:
              cpu: ${APP_CPU_LIMIT}
              memory: ${APP_MEM_LIMIT}
          # 存活探针：容器无响应时 K8s 自动重启（failureThreshold=3 × periodSeconds=20 = 最多 60s 检测）
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60    # 等待 Spring Boot 完全启动
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # 就绪探针：Pod 未就绪时从 Service 端点移除（DB/Redis/Nacos 不可用则 DOWN）
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 启动探针：给 JVM 充足预热时间，避免存活探针过早杀死正在启动的容器
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30            # 最多 30×5=150s 启动时间（含 JIT 编译预热）
          # 容器安全上下文：只读根文件系统 + 非 root + 禁止提权
          securityContext:
            readOnlyRootFilesystem: true      # /tmp 通过 emptyDir 单独挂载为可写
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp                 # Sentinel 日志 + JVM 临时文件
      volumes:
        - name: tmp
          emptyDir: {}
