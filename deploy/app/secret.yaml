# ============================================================
# ZhiYu-Backend — Secret 参考模板
# ============================================================
# 此文件不在 deploy.sh 中直接 apply，而是作为文档参考。
# 实际部署时：
#   1. deploy.sh 通过 kubectl create secret generic 动态生成 Secret
#      （含 JWT 密钥、DB 凭据等）
#   2. 第三方密钥（微信/支付宝/阿里云）需手动填入或通过 ExternalSecret 注入
#   3. 生产环境建议使用 SealedSecret 或 External Secrets Operator
# ============================================================
# 手动创建参考命令:
#
# kubectl -n ${K8S_NAMESPACE} create secret generic zhiyu-backend-secret \
#   --from-literal=SPRING_DATASOURCE_USERNAME='zhiyu' \
#   --from-literal=SPRING_DATASOURCE_PASSWORD='<密码>' \
#   --from-literal=SPRING_DATA_REDIS_PASSWORD='<密码>' \
#   --from-literal=JWT_PRIVATE_KEY='$(base64 < jwt-private.pem | tr -d '\n')' \
#   --from-literal=JWT_PUBLIC_KEY='$(base64 < jwt-public.pem | tr -d '\n')' \
#   --from-literal=ENCRYPTION_KEY='$(openssl rand -base64 32)' \
#   --from-literal=WECHAT_APP_ID='<微信 AppID>' \
#   --from-literal=WECHAT_APP_SECRET='<微信 AppSecret>' \
#   --from-literal=ALIPAY_APP_ID='<支付宝 AppID>' \
#   --from-literal=ALIPAY_PRIVATE_KEY='<支付宝应用私钥>' \
#   --from-literal=ALIPAY_ALIPAY_PUBLIC_KEY='<支付宝公钥>' \
#   --from-literal=WECHAT_PAY_MCH_ID='<微信商户号>' \
#   --from-literal=WECHAT_PAY_API_V3_KEY='<微信支付 APIv3 密钥>' \
#   --from-literal=ALIYUN_ACCESS_KEY_ID='<阿里云 AccessKey>' \
#   --from-literal=ALIYUN_ACCESS_KEY_SECRET='<阿里云 Secret>'
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: zhiyu-backend-secret
  namespace: ${K8S_NAMESPACE}
  labels:
    app: zhiyu-backend
type: Opaque
stringData: {}  # 实际值由 deploy.sh 或 ExternalSecret 注入
