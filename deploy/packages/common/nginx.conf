# ── HTTP 服务器（内部 / 直连访问） ──
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩（减少传输体积）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # ── HTTPS 检测 ──
    # 当通过 K8s Ingress（TLS Termination）访问时，$http_x_forwarded_proto 为 "https"
    # 直连 HTTP（NodePort）访问时为空或 "http"，强制重定向到 HTTPS
    set $is_https "false";
    if ($http_x_forwarded_proto = "https") {
        set $is_https "true";
    }
    if ($https = "on") {
        set $is_https "true";
    }
    # 非 HTTPS 且非健康检查请求 → 重定向提示
    # （健康检查绕过，避免探活重定向导致失败）
    set $redirect_to_https "false";
    if ($is_https = "false") {
        set $redirect_to_https "true";
    }
    if ($uri = "/nginx_status") {
        set $redirect_to_https "false";
    }
    if ($uri = "/") {
        # 根路径即使是 HTTP 也不重定向（用于健康检查）
        set $redirect_to_https "false";
    }

    # ── SPA 关键配置 ──
    # SPA 路由（如 /admin/users/123）不存在对应的文件，
    # 全部回退到 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API 反向代理 ──
    location /api/ {
        # K8s 内部 Service DNS
        proxy_pass http://zhiyu-backend:8080;

        # 透传原始请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（后端业务可能耗时较长）
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;

        # 禁用 upstream 缓冲（SSE / 流式响应需要）
        proxy_buffering off;
    }

    # ── Nginx 状态端点（Prometheus nginx-exporter 抓取） ──
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # ── 安全头 ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 静态资源强缓存（文件名含 hash，可永久缓存） ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── 禁止访问隐藏文件 ──
    location ~ /\. {
        deny all;
    }
}
