# ============================================================
# ZhiYu-Backend — 集成测试 Profile
# 激活方式: -Dspring.profiles.active=test
# Testcontainers 通过 @DynamicPropertySource 动态覆盖数据源
# ============================================================
spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

  datasource:
    # 占位 — 测试运行时由 @DynamicPropertySource 覆盖为
    # Testcontainers 提供的 jdbc:tc:mysql:8.0:///zhiyu_test
    url: jdbc:tc:mysql:8.0:///zhiyu_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&TC_REUSABLE=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 3
          max-idle: 1
          min-idle: 1

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: false
    placeholders:
      admin-password-hash: '$2b$10$5mddc0a44RS1Dnp/xtO6meLmO1bqZ7jrbINk34xISmYCCd8F2U3Ri'

zhiyu:
  auth:
    bcrypt-cost-factor: 4

logging:
  level:
    root: WARN
    com.zhiyu: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
