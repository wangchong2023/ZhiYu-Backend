# ============================================================
# ZhiYu-Backend — 默认配置（所有 Profile 共享）
# Profile 覆盖: application-dev.yml / application-test.yml / application-release.yml
# 独立配置模块: datasource / redis / mybatis / jwt / security
# 生产环境敏感配置走 Nacos + K8s Secret，不在此文件中
# ============================================================

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: zhiyu-backend

  # Nacos — 默认关闭，dev/release profile 中启用
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

  # 模块化配置导入
  config:
    import:
      - classpath:application-datasource.yml
      - classpath:application-redis.yml
      - classpath:application-mybatis.yml
      - classpath:application-jwt.yml
      - classpath:application-security.yml

  # i18n
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    default-locale: zh_CN

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# SpringDoc OpenAPI — 默认关闭，dev profile 中开启
springdoc:
  api-docs:
    enabled: false
    path: /api/v1/docs/api-docs
  swagger-ui:
    enabled: false
    path: /api/v1/docs/swagger-ui

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# 日志
logging:
  level:
    root: WARN
    com.zhiyu: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
