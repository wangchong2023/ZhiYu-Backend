# ============================================================
# ZhiYu-Backend — Nacos 配置引导
# 仅在 spring.cloud.nacos.config.enabled=true 时生效
# ============================================================

spring:
  application:
    name: zhiyu-backend
  cloud:
    nacos:
      # 资深架构师加固：显式绑定 Nacos 鉴权用户名与强密码环境变量，彻底根除开启鉴权后的 403/user not found 死锁问题
      username: ${SPRING_CLOUD_NACOS_USERNAME:nacos}
      password: ${SPRING_CLOUD_NACOS_PASSWORD:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
        # 共享配置
        shared-configs:
          - data-id: subscription-plans.yml
            group: SUBSCRIPTION
            refresh: true
          - data-id: feature-flags.yml
            group: BIZ_CONFIG
            refresh: true
          - data-id: rate-limit-thresholds.yml
            group: RATE_LIMIT
            refresh: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:dev}
        enabled: false
