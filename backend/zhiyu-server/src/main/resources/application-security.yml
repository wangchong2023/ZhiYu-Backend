# ============================================================
# ZhiYu-Backend — 安全配置（独立文件，便于集中管理）
# 通过 spring.config.import 导入
# ============================================================

zhiyu:
  security:
    # 无需认证即可访问的路径（支持 Ant 风格 ? * **）
    permit-all-paths:
      - /api/v1/auth/**
      - /api/v1/admin/login
      - /api/v1/admin/version
      - /actuator/health/**
      - /actuator/prometheus
      - /api/v1/docs/**
