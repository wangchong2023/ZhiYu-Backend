# ============================================================
# ZhiYu-Backend — 安全配置（独立文件，便于集中管理）
# 通过 spring.config.import 导入
# ============================================================

zhiyu:
  security:
    # 无需认证即可访问的路径（支持 Ant 风格 ? * **）
    permit-all-paths:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/send-register-code
      - /api/v1/auth/captcha/**
      - /api/v1/auth/refresh
      - /api/v1/auth/sms/send
      - /api/v1/auth/oauth/**
      - /api/v1/auth/webauthn/authenticate/**
      - /api/v1/admin/login
      - /api/v1/admin/version
      - /actuator/health/**
      - /actuator/prometheus
      - /api/v1/docs/**
