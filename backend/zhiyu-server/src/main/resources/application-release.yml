# ============================================================
# ZhiYu-Backend — 生产发布 Profile
# 激活方式: -Dspring.profiles.active=release
# 所有敏感信息通过 K8s Secret 环境变量注入，无默认值
# ============================================================

spring:
  cloud:
    nacos:
      config:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:release}
        group: DEFAULT_GROUP
        file-extension: yml
        refresh-enabled: true
        extension-configs:
          - group: SUBSCRIPTION
            data-id: subscription-plans.yml
            refresh: true
          - group: SUBSCRIPTION
            data-id: payment-channels.yml
            refresh: true
          - group: BIZ_CONFIG
            data-id: feature-flags.yml
            refresh: true
          - group: RATE_LIMIT
            data-id: rate-limit-thresholds.yml
            refresh: true
      discovery:
        enabled: true
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:release}
        group: DEFAULT_GROUP

  # 生产数据源 — 全部走环境变量，无默认值
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:zhiyu}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # 生产 Redis — Sentinel 模式
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:zhiyu}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=true&allowPublicKeyRetrieval=false
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# 生产 Actuator — 最小暴露
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true

# 生产日志
logging:
  level:
    root: WARN
    com.zhiyu: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
