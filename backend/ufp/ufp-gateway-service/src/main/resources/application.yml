server:
  port: ${GATEWAY_PORT:8443}
  http:
    port: ${GATEWAY_HTTP_PORT:8080}

spring:
  application:
    name: ufp-gateway
  web:
    resources:
      static-locations: classpath:/static/, classpath:/public/, file:/app/static/
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # Auth service routes
        - id: auth-service
          uri: http://ufp-auth:8080
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
        # User service routes
        - id: user-service
          uri: http://zhiyu-admin:8080
          predicates:
            - Path=/api/v1/user/**
          filters:
            - StripPrefix=0
        # Admin service routes
        - id: admin-service
          uri: http://zhiyu-admin:8080
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=0
        # Public actuator endpoints
        - id: actuator
          uri: http://zhiyu-admin:8080
          predicates:
            - Path=/actuator/**
          filters:
            - StripPrefix=0
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
    sentinel:
      enabled: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"message":"Too many requests"}'

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
