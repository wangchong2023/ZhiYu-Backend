# ============================================================
# ufp-auth-service — 认证微服务配置
# 职责: JWT/OAuth/TOTP/WebAuthn/登录/注册/Token管理
# ============================================================

server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: ufp-auth-service

  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false

  # i18n
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    default-locale: zh_CN

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Datasource (ufp_auth + zhiyu 双数据源)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zhiyu_dev}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:zhiyu}
    password: ${MYSQL_PASSWORD:}

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhiyu.ufp.auth.entity,com.zhiyu.auth.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
zhiyu:
  security:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      access-token-expiration: 3600
      refresh-token-expiration: 604800
      issuer: zhiyu-auth
    permit-all-paths:
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/auth/refresh
      - /api/v1/auth/send-sms
      - /api/v1/auth/captcha/**
      - /api/v1/auth/oauth/**
      - /api/v1/auth/webauthn/**
      - /api/v1/auth/carrier
      - /api/v1/auth/guest
      - /api/v1/public/**
      - /actuator/health
      - /actuator/health/**
      - /error

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: WARN
    com.zhiyu: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"
