# ============================================================
# ZhiYu-Backend CI — 构建 + 测试 + 打包
#
# 注意：Docker 构建 + kubeadm 部署由 Woodpecker CI 处理
# 触发规则:
#   feature/* push     → Stage 1 (build + test)
#   PR → main          → Stage 1 + 2 (build + test + integration-test)
#   main push          → Stage 1 + 2 + 3 (→ package JAR)
#   release/* push     → Stage 1 + 2 + 3
#   schedule (每日)    → Stage 1 + 安全扫描
# ============================================================
name: CI/CD

on:
  push:
    branches: [main, 'release/**', 'feature/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 21 * * *'  # 每日 05:00 CST = 21:00 UTC

env:
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin

jobs:
  # ═══════════════════════════════════════════════════════════
  # Stage 1: 编译 + 单元测试 + 静态检查
  # ═══════════════════════════════════════════════════════════
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Gitleaks 需要完整历史

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      # ── 代码风格 ──
      - name: Checkstyle
        run: ./mvnw -f backend/pom.xml checkstyle:check -B -q || true  # 不阻塞，先警告

      - name: SpotBugs
        run: ./mvnw -f backend/pom.xml spotbugs:check -B -q || true

      # ── 编译 + 单元测试 ──
      - name: 编译 + 单元测试
        run: ./mvnw -f backend/pom.xml test -B -pl zhiyu-server -am

      # ── 覆盖率 ──
      - name: JaCoCo 覆盖率报告
        if: always()
        run: |
          COV=0
          for f in $(find . -path "*/target/site/jacoco/index.html" 2>/dev/null); do
            LINE_COV=$(grep -oP 'Total.*?ctr2">\K[0-9]+' "$f" | head -1 || echo 0)
            echo "Coverage file: $f → ${LINE_COV}%"
            [ "$LINE_COV" -gt "$COV" ] && COV=$LINE_COV
          done
          echo "Overall coverage: ${COV}%"
          if [ "$COV" -lt 80 ]; then
            echo "::warning::覆盖率 ${COV}% 低于 80% 门槛"
          fi

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/target/site/jacoco/**"
          retention-days: 7

      # ── 密钥泄露扫描 ──
      - name: Gitleaks secret scan
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════
  # Stage 1b: 依赖漏洞扫描 (并行，不阻塞关键路径)
  # ═══════════════════════════════════════════════════════════
  dependency-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'schedule'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: OWASP Dependency Check
        run: ./mvnw -f backend/pom.xml org.owasp:dependency-check-maven:check -B || echo "::warning::OWASP check found issues"

  # ═══════════════════════════════════════════════════════════
  # Stage 2: 集成测试
  # ═══════════════════════════════════════════════════════════
  integration-test:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: 集成测试 (Testcontainers)
        run: ./mvnw -f backend/pom.xml verify -B -pl zhiyu-server -am -DskipUTs=true -Dpmd.skip=true
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:tc:mysql:8.0:///zhiyu_test
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: "**/target/failsafe-reports/**"
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # Stage 3: 打包 (仅 main/release)
  # ═══════════════════════════════════════════════════════════
  package:
    needs: [build-and-test, integration-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Maven 打包（跳过测试）
        run: ./mvnw -f backend/pom.xml package -DskipTests -B -q -pl zhiyu-server -am

      - name: 上传 JAR 制品
        uses: actions/upload-artifact@v4
        with:
          name: zhiyu-server-jar
          path: backend/zhiyu-server/target/zhiyu-server-*.jar
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # 夜间安全扫描 (仅 schedule)
  # ═══════════════════════════════════════════════════════════
  nightly-scan:
    if: github.event_name == 'schedule'
    needs: [build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: OWASP Dependency Check (完整扫描)
        run: ./mvnw -f backend/pom.xml org.owasp:dependency-check-maven:check -B

      - name: Trivy 文件系统扫描
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: 上传扫描报告
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
